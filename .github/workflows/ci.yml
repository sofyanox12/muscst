name: CI - Lint & Packaging Standards

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm base-devel git namcap python

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Python CLI Syntax
        run: |
          python3 -m py_compile bin/muscst
          ./bin/muscst --help

      - name: Audit PKGBUILD with Namcap
        run: |
          namcap PKGBUILD

      - name: Validate .SRCINFO consistency
        run: |
          useradd -m builduser
          chown -R builduser:builduser .
          su builduser -c "makepkg --printsrcinfo" > /tmp/.SRCINFO.check
          diff -u .SRCINFO /tmp/.SRCINFO.check
